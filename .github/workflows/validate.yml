name: Validate Case

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate diagrams and images
        run: |
          node scripts/generate-case.mjs
          node scripts/render-svg.mjs

      - name: Check generator output matches committed files
        run: |
          if [ -n "$(git status --porcelain diagrams images)" ]; then
            echo "Diagramas ou imagens versionados estão fora de sincronia com os geradores."
            git --no-pager diff --stat diagrams images
            exit 1
          fi
          echo "Diagramas e imagens em sincronia com os geradores."

      - name: Validate diagram JSON
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('diagrams/manifest.json'));for(const f of m.diagrams){const d=JSON.parse(fs.readFileSync('diagrams/'+f));if(!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw new Error('Invalid '+f);}console.log('OK: '+m.diagrams.length+' diagramas válidos');"
